<g font-family="Arial,Helvetica,sans-serif">
<text x="30" y="36" fill="#e6edf3" font-size="15" font-weight="700">BRANCH · BUILD · REVIEW · MERGE</text>
<text x="1090" y="36" text-anchor="end" fill="#82939e" font-size="11">ILLUSTRATIVE WORKFLOW</text>
<g font-size="15" font-weight="700" text-anchor="middle">
<rect x="129" y="61" width="200" height="35" rx="17" fill="#20331e"/><text x="229" y="84" fill="#b8e684">main</text>
<rect x="459" y="61" width="200" height="35" rx="17" fill="#133239"/><text x="559" y="84" fill="#85d9d5">feature/rag</text>
<rect x="789" y="61" width="200" height="35" rx="17" fill="#222a43"/><text x="889" y="84" fill="#b1c2f4">fix/retrieval</text>
</g>
<g fill="none" stroke-width="3">
