<path d="M229 124C394 124 559 132 559 188V250C559 294 394 310 229 310" stroke="#67cfc8"/>
<path d="M229 310C557 310 889 309 889 372C889 419 560 434 229 434" stroke="#a3b9ed"/>
</g>
<g fill="#0d141c" stroke-width="3">
<circle cx="229" cy="124" r="8" stroke="#a3df42"/>
<circle cx="559" cy="188" r="8" stroke="#67cfc8"/>
<circle cx="559" cy="250" r="8" stroke="#67cfc8"/>
<circle cx="229" cy="310" r="10" stroke="#a3df42"/>
<circle cx="229" cy="310" r="3" fill="#a3df42" stroke="none"/>
<circle cx="889" cy="372" r="8" stroke="#a3b9ed"/>
<circle cx="229" cy="434" r="10" stroke="#a3df42"/>
<circle cx="229" cy="434" r="3" fill="#a3df42" stroke="none"/>
</g>
<g fill="#e0e9ee" font-size="15">
<text x="30" y="129">Baseline commit</text>
<text x="585" y="193">Implement retrieval</text>
<text x="585" y="255">Evaluate + refine</text>
<text x="30" y="304">Reviewed merge</text>
<text x="30" y="327" fill="#b8e684" font-size="12">RELEASE v1.0</text>
<text x="912" y="369">Fix retrieval</text><text x="912" y="391" fill="#a9b8c3" font-size="13">edge case</text>
<text x="30" y="430">Patch merge</text>
<text x="30" y="453" fill="#b8e684" font-size="12">RELEASE v1.0.1</text>
</g>
<path d="M30 490H1090" stroke="#2c3944"/>
<text x="30" y="523" fill="#9facb7" font-size="12">Example development flow for an AI project. Release labels and commits are illustrative.</text>
</g></svg>
