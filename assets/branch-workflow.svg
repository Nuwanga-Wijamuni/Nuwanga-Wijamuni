<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="552" viewBox="0 0 1120 552" role="img" aria-labelledby="title desc">
<title id="title">Illustrative Git branch and merge workflow for an AI feature</title>
<desc id="desc">Start on main. Branch into feature/rag, implement retrieval, evaluate, and merge as v1.0. Branch into fix/retrieval, correct an edge case, and merge as v1.0.1. This is an example, not actual repository history.</desc>
